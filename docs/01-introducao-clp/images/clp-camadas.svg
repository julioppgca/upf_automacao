<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="638" height="518" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="320" y="28" font-size="15.5" font-weight="700" fill="#1e293b" text-anchor="middle">Um CLP por dentro: camadas sobre um microcontrolador</text>

  <!-- camada 4 (externa) -->
  <rect x="40" y="85" width="560" height="290" rx="16" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- camada 3 -->
  <rect x="100" y="115" width="440" height="230" rx="14" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <!-- camada 2 -->
  <rect x="160" y="145" width="320" height="170" rx="12" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <!-- camada 1 (nucleo) -->
  <rect x="220" y="185" width="200" height="90" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="320" y="222" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Núcleo digital</text>
  <text x="320" y="240" font-size="10.5" fill="#334155" text-anchor="middle">(microcontrolador /</text>
  <text x="320" y="253" font-size="10.5" fill="#334155" text-anchor="middle">microprocessador)</text>

  <!-- selos numerados -->
  <circle cx="420" cy="185" r="13" fill="#2563eb"/>
  <text x="420" y="190" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="480" cy="145" r="13" fill="#16a34a"/>
  <text x="480" y="150" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="540" cy="115" r="13" fill="#ea580c"/>
  <text x="540" y="120" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="600" cy="85" r="13" fill="#7c3aed"/>
  <text x="600" y="90" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- legenda -->
  <g font-size="12" fill="#334155">
    <circle cx="55" cy="401" r="7" fill="#2563eb"/>
    <text x="72" y="406" font-weight="700" fill="#1e293b">1 —</text>
    <text x="98" y="406">núcleo digital: microcontrolador/microprocessador que executa instruções</text>

    <circle cx="55" cy="429" r="7" fill="#16a34a"/>
    <text x="72" y="434" font-weight="700" fill="#1e293b">2 —</text>
    <text x="98" y="434">+ E/S industriais isoladas, que protegem o núcleo do ruído e da tensão de campo</text>

    <circle cx="55" cy="457" r="7" fill="#ea580c"/>
    <text x="72" y="462" font-weight="700" fill="#1e293b">3 —</text>
    <text x="98" y="462">+ firmware de tempo real, que roda o ciclo de varredura de forma determinística</text>

    <circle cx="55" cy="485" r="7" fill="#7c3aed"/>
    <text x="72" y="490" font-weight="700" fill="#1e293b">4 —</text>
    <text x="98" y="490">+ invólucro robusto e linguagens IEC 61131-3 = o produto final é o CLP</text>
  </g>
</svg>
