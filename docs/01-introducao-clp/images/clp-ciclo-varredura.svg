<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="698" height="258" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="28" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Ciclo de varredura (scan cycle) da CPU</text>

  <!-- caminho de retorno (atras das caixas) -->
  <path d="M 570 145 L 570 200 L 130 200 L 130 145" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <polygon points="122,153 138,153 130,138" fill="#94a3b8"/>
  <text x="350" y="218" font-size="11.5" fill="#64748b" text-anchor="middle">repete continuamente (ex.: a cada 20 ms)</text>

  <!-- passo 1 -->
  <rect x="40" y="65" width="180" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="130" y="95" font-size="13.5" font-weight="700" fill="#16a34a" text-anchor="middle">1. LÊ ENTRADAS</text>
  <text x="130" y="115" font-size="10.5" fill="#166534" text-anchor="middle">copia o estado físico</text>
  <text x="130" y="128" font-size="10.5" fill="#166534" text-anchor="middle">dos sensores para %I</text>

  <line x1="220" y1="105" x2="248" y2="105" stroke="#1e293b" stroke-width="3"/>
  <polygon points="248,96 248,114 262,105" fill="#1e293b"/>

  <!-- passo 2 -->
  <rect x="262" y="65" width="180" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="352" y="95" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">2. EXECUTA O</text>
  <text x="352" y="110" font-size="13.5" font-weight="700" fill="#2563eb" text-anchor="middle">PROGRAMA</text>
  <text x="352" y="130" font-size="10.5" fill="#1e3a8a" text-anchor="middle">resolve a lógica (Ladder,</text>
  <text x="352" y="140" font-size="10.5" fill="#1e3a8a" text-anchor="middle">ST, FBD...) usando %I e %M</text>

  <line x1="442" y1="105" x2="470" y2="105" stroke="#1e293b" stroke-width="3"/>
  <polygon points="470,96 470,114 484,105" fill="#1e293b"/>

  <!-- passo 3 -->
  <rect x="484" y="65" width="176" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="572" y="95" font-size="13.5" font-weight="700" fill="#ea580c" text-anchor="middle">3. ATUALIZA</text>
  <text x="572" y="110" font-size="13.5" font-weight="700" fill="#ea580c" text-anchor="middle">SAÍDAS</text>
  <text x="572" y="130" font-size="10.5" fill="#9a3412" text-anchor="middle">copia %Q calculado para</text>
  <text x="572" y="140" font-size="10.5" fill="#9a3412" text-anchor="middle">os módulos físicos de saída</text>
</svg>
