  <polyline points="662.0,160.0 690,160.0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="645.0" y="148.0" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="400">R_O  100 Ω</text>
  <circle cx="694" cy="160.0" r="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text x="706" y="164.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="700">saída 0–10 V</text>
  <text x="560" y="230.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">Ganho = 1 + R_FB/R_G = 1 + 20/10 = 3</text>
  <text x="560" y="244.3" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">3,3 V × 3 = 9,9 V</text>
  <text x="560" y="258.6" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">LM358: saída vai até V+ − 1,6 V (5 mA)</text>
  <text x="560" y="272.9" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">→ alimentar com 15–24 V, não 12 V</text>
  <text x="560" y="287.2" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">R_O protege contra curto e cabo longo</text>
  <text x="40" y="270.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">PWM 5 kHz + R_F·C_F (f_c = 16 Hz):</text>
  <text x="40" y="284.3" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">ondulação ≈ 3,3/(4·5000·0,01) = 17 mV</text>
