<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="698" height="218" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="28" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">FBD — AND + Temporizador TON</text>

  <!-- entradas -->
  <text x="30" y="80" font-size="14" font-weight="700" fill="#1e293b">I0.0</text>
  <line x1="65" y1="76" x2="120" y2="76" stroke="#1e293b" stroke-width="3"/>
  <text x="30" y="130" font-size="14" font-weight="700" fill="#1e293b">I0.1</text>
  <line x1="65" y1="126" x2="120" y2="126" stroke="#1e293b" stroke-width="3"/>

  <!-- bloco AND -->
  <rect x="120" y="55" width="90" height="90" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="165" y="105" font-size="16" font-weight="700" fill="#2563eb" text-anchor="middle">AND</text>
  <text x="130" y="72" font-size="11" fill="#475569">IN1</text>
  <text x="130" y="140" font-size="11" fill="#475569">IN2</text>

  <line x1="210" y1="100" x2="270" y2="100" stroke="#1e293b" stroke-width="3"/>

  <!-- bloco TON -->
  <rect x="270" y="40" width="150" height="120" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="345" y="65" font-size="16" font-weight="700" fill="#ea580c" text-anchor="middle">TON</text>
  <text x="280" y="105" font-size="12" fill="#475569">IN</text>
  <text x="280" y="150" font-size="12" fill="#475569">PT := T#2s</text>
  <text x="410" y="105" font-size="12" fill="#475569" text-anchor="end">Q</text>

  <line x1="420" y1="100" x2="500" y2="100" stroke="#1e293b" stroke-width="3"/>

  <!-- saida -->
  <rect x="500" y="76" width="90" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="545" y="106" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">Q0.0</text>

  <text x="345" y="185" font-size="12" fill="#64748b" text-anchor="middle">Q0.0 := TON(IN := I0.0 AND I0.1, PT := T#2s).Q</text>
</svg>
