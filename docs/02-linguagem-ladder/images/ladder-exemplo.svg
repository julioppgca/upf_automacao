<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="698" height="258" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="28" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Ladder — Circuito Start/Stop com selo (self-holding)</text>

  <!-- barramentos de energia -->
  <line x1="45" y1="50" x2="45" y2="235" stroke="#1e293b" stroke-width="5"/>
  <line x1="655" y1="50" x2="655" y2="235" stroke="#1e293b" stroke-width="5"/>

  <!-- ===== rung principal (y=95) ===== -->
  <line x1="45" y1="95" x2="105" y2="95" stroke="#1e293b" stroke-width="3"/>

  <!-- contato NA: Start -->
  <line x1="105" y1="79" x2="105" y2="111" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="135" y1="79" x2="135" y2="111" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="70" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">I0.0</text>
  <text x="120" y="130" font-size="12" fill="#2563eb" text-anchor="middle">Start (NA)</text>

  <line x1="135" y1="95" x2="195" y2="95" stroke="#1e293b" stroke-width="3"/>

  <!-- contato NF: Stop -->
  <line x1="195" y1="79" x2="195" y2="111" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="225" y1="79" x2="225" y2="111" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="113" x2="230" y2="77" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="210" y="70" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">I0.1</text>
  <text x="210" y="130" font-size="12" fill="#2563eb" text-anchor="middle">Stop (NF)</text>

  <line x1="225" y1="95" x2="568" y2="95" stroke="#1e293b" stroke-width="3"/>

  <!-- bobina -->
  <circle cx="590" cy="95" r="22" fill="none" stroke="#ea580c" stroke-width="4"/>
  <text x="590" y="70" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Q0.0</text>
  <text x="590" y="132" font-size="12" fill="#ea580c" text-anchor="middle">Motor (bobina)</text>
  <line x1="612" y1="95" x2="655" y2="95" stroke="#1e293b" stroke-width="3"/>

  <!-- ===== ramo paralelo de selo (y=175), em paralelo apenas com Start ===== -->
  <line x1="105" y1="95" x2="105" y2="175" stroke="#1e293b" stroke-width="3"/>
  <line x1="105" y1="175" x2="140" y2="175" stroke="#1e293b" stroke-width="3"/>

  <line x1="140" y1="159" x2="140" y2="191" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="170" y1="159" x2="170" y2="191" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="155" y="212" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Q0.0</text>
  <text x="155" y="230" font-size="12" fill="#2563eb" text-anchor="middle">Selo (NA)</text>

  <line x1="170" y1="175" x2="180" y2="175" stroke="#1e293b" stroke-width="3"/>
  <line x1="180" y1="175" x2="180" y2="95" stroke="#1e293b" stroke-width="3"/>
</svg>
