<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="438" height="428" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="220" y="28" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">SFC — Ciclo de um cilindro pneumático</text>

  <!-- seta de retorno (desenhada antes, para ficar atras dos passos) -->
  <path d="M 185 340 L 400 340 L 400 45 L 185 45 L 185 58" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  <polygon points="177,52 193,52 185,65" fill="#94a3b8"/>
  <text x="405" y="200" font-size="11" fill="#64748b" text-anchor="middle" transform="rotate(90 405 200)">reinicia o ciclo</text>

  <!-- Passo inicial (duplo contorno = ativo) -->
  <rect x="130" y="60" width="110" height="42" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="135" y="65" width="100" height="32" rx="2" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="185" y="86" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">Inicial</text>
  <text x="250" y="86" font-size="12" fill="#475569">Espera Start</text>

  <line x1="185" y1="102" x2="185" y2="127" stroke="#1e293b" stroke-width="3"/>
  <line x1="160" y1="127" x2="210" y2="127" stroke="#1e293b" stroke-width="4"/>
  <text x="222" y="132" font-size="12" fill="#334155">T1: Start</text>

  <!-- Passo 1 -->
  <line x1="185" y1="127" x2="185" y2="152" stroke="#1e293b" stroke-width="3"/>
  <rect x="130" y="152" width="110" height="42" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="185" y="178" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Passo 1</text>
  <text x="250" y="178" font-size="12" fill="#475569">Avançar cilindro</text>

  <line x1="185" y1="194" x2="185" y2="219" stroke="#1e293b" stroke-width="3"/>
  <line x1="160" y1="219" x2="210" y2="219" stroke="#1e293b" stroke-width="4"/>
  <text x="222" y="224" font-size="12" fill="#334155">T2: Sensor S1</text>

  <!-- Passo 2 -->
  <line x1="185" y1="219" x2="185" y2="244" stroke="#1e293b" stroke-width="3"/>
  <rect x="130" y="244" width="110" height="42" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="185" y="270" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Passo 2</text>
  <text x="250" y="270" font-size="12" fill="#475569">Recuar cilindro</text>

  <line x1="185" y1="286" x2="185" y2="311" stroke="#1e293b" stroke-width="3"/>
  <line x1="160" y1="311" x2="210" y2="311" stroke="#1e293b" stroke-width="4"/>
  <text x="222" y="316" font-size="12" fill="#334155">T3: Sensor S0</text>

  <line x1="185" y1="311" x2="185" y2="340" stroke="#1e293b" stroke-width="3"/>

  <!-- legenda -->
  <rect x="30" y="380" width="16" height="16" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="55" y="393" font-size="12" fill="#475569">Etapa (step)</text>
  <line x1="180" y1="388" x2="210" y2="388" stroke="#1e293b" stroke-width="4"/>
  <text x="220" y="393" font-size="12" fill="#475569">Transição</text>
</svg>
