<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="798" height="328" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400" y="28" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Paralelo  =  OU (OR)</text>

  <!-- ===== coluna 1: contatos eletricos em paralelo ===== -->
  <text x="150" y="55" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">1. CONTATOS EM PARALELO</text>
  <text x="65" y="115" font-size="14" font-weight="700" fill="#1e293b">+</text>
  <line x1="80" y1="110" x2="105" y2="110" stroke="#1e293b" stroke-width="3"/>

  <!-- ramo A (principal) -->
  <line x1="105" y1="94" x2="105" y2="126" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="94" x2="130" y2="126" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="117" y="86" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">A</text>
  <line x1="130" y1="110" x2="165" y2="110" stroke="#1e293b" stroke-width="3"/>

  <!-- ramo B (paralelo) -->
  <line x1="105" y1="110" x2="105" y2="170" stroke="#1e293b" stroke-width="3"/>
  <line x1="105" y1="170" x2="130" y2="170" stroke="#1e293b" stroke-width="3"/>
  <line x1="130" y1="154" x2="130" y2="186" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="154" x2="155" y2="186" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="142" y="206" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">B</text>
  <line x1="155" y1="170" x2="165" y2="170" stroke="#1e293b" stroke-width="3"/>
  <line x1="165" y1="170" x2="165" y2="110" stroke="#1e293b" stroke-width="3"/>

  <line x1="165" y1="110" x2="215" y2="110" stroke="#1e293b" stroke-width="3"/>
  <circle cx="230" cy="110" r="15" fill="none" stroke="#ea580c" stroke-width="3.5"/>
  <line x1="245" y1="110" x2="265" y2="110" stroke="#1e293b" stroke-width="3"/>
  <text x="278" y="115" font-size="14" font-weight="700" fill="#1e293b">-</text>
  <text x="150" y="230" font-size="12" fill="#64748b" text-anchor="middle">Lâmpada acende se A</text>
  <text x="150" y="245" font-size="12" fill="#64748b" text-anchor="middle">ou B estiver fechado</text>

  <line x1="308" y1="110" x2="330" y2="110" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="330,101 330,119 345,110" fill="#94a3b8"/>

  <!-- ===== coluna 2: porta logica OR ===== -->
  <text x="430" y="55" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">2. PORTA LÓGICA</text>
  <rect x="370" y="80" width="120" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="3"/>
  <text x="430" y="122" font-size="18" font-weight="700" fill="#0d9488" text-anchor="middle">OR</text>
  <line x1="340" y1="98" x2="370" y2="98" stroke="#1e293b" stroke-width="3"/>
  <text x="330" y="102" font-size="13" font-weight="700" fill="#1e293b" text-anchor="end">A</text>
  <line x1="340" y1="132" x2="370" y2="132" stroke="#1e293b" stroke-width="3"/>
  <text x="330" y="136" font-size="13" font-weight="700" fill="#1e293b" text-anchor="end">B</text>
  <line x1="490" y1="115" x2="520" y2="115" stroke="#1e293b" stroke-width="3"/>
  <text x="530" y="119" font-size="13" font-weight="700" fill="#1e293b">Q</text>
  <text x="430" y="165" font-size="12" fill="#64748b" text-anchor="middle">Q = A + B</text>

  <line x1="548" y1="115" x2="568" y2="115" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="568,106 568,124 582,115" fill="#94a3b8"/>

  <!-- ===== coluna 3: ladder ===== -->
  <text x="680" y="55" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">3. LADDER (CLP)</text>
  <line x1="590" y1="90" x2="590" y2="200" stroke="#1e293b" stroke-width="4"/>
  <line x1="770" y1="90" x2="770" y2="200" stroke="#1e293b" stroke-width="4"/>

  <line x1="590" y1="110" x2="615" y2="110" stroke="#1e293b" stroke-width="3"/>
  <line x1="615" y1="94" x2="615" y2="126" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="640" y1="94" x2="640" y2="126" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="627" y="86" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">A</text>
  <line x1="640" y1="110" x2="725" y2="110" stroke="#1e293b" stroke-width="3"/>

  <line x1="590" y1="110" x2="590" y2="170" stroke="#1e293b" stroke-width="3"/>
  <line x1="590" y1="170" x2="615" y2="170" stroke="#1e293b" stroke-width="3"/>
  <line x1="615" y1="154" x2="615" y2="186" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="640" y1="154" x2="640" y2="186" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="627" y="206" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">B</text>
  <line x1="640" y1="170" x2="655" y2="170" stroke="#1e293b" stroke-width="3"/>
  <line x1="655" y1="170" x2="655" y2="110" stroke="#1e293b" stroke-width="3"/>

  <circle cx="740" cy="110" r="15" fill="none" stroke="#ea580c" stroke-width="3.5"/>
  <line x1="755" y1="110" x2="770" y2="110" stroke="#1e293b" stroke-width="3"/>
  <text x="680" y="230" font-size="12" fill="#64748b" text-anchor="middle">Q := A OR B;</text>

  <!-- tabela verdade -->
  <g transform="translate(300,195)">
    <text x="100" y="0" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Tabela-verdade</text>
    <g font-size="13" fill="#1e293b" text-anchor="middle">
      <line x1="0" y1="10" x2="200" y2="10" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="30" y="30" font-weight="700">A</text>
      <text x="100" y="30" font-weight="700">B</text>
      <text x="170" y="30" font-weight="700">Q</text>
      <line x1="0" y1="38" x2="200" y2="38" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="30" y="58">0</text><text x="100" y="58">0</text><text x="170" y="58">0</text>
      <text x="30" y="80" font-weight="700" fill="#ea580c">0</text><text x="100" y="80" font-weight="700" fill="#ea580c">1</text><text x="170" y="80" font-weight="700" fill="#ea580c">1</text>
      <text x="30" y="102" font-weight="700" fill="#ea580c">1</text><text x="100" y="102" font-weight="700" fill="#ea580c">0</text><text x="170" y="102" font-weight="700" fill="#ea580c">1</text>
      <text x="30" y="124" font-weight="700" fill="#ea580c">1</text><text x="100" y="124" font-weight="700" fill="#ea580c">1</text><text x="170" y="124" font-weight="700" fill="#ea580c">1</text>
    </g>
  </g>
</svg>
